<!doctype html>
<html class="no-js" lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Score Keeper</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="">

  <meta property="og:title" content="">
  <meta property="og:type" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <meta property="og:image:alt" content="">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#fafafa">
</head>

<body>

<header>
  <h1>Score Keeper</h1>
</header>
<article class="Scoreboard">
<h2 id="max-score">First to 5</h2>

<p><b id="teamA-score">Team A: X</b> | <b id="teamB-score">Team B: X</b></p>
<div id="commands">
<input type="button" value="Team A scored!" id="plus-A" name="plus-A">
<input type="button" value="Team B scored!" id="plus-B" name="plus-B">
<input type="button" value="Reset" id="reset" name="reset">
<label for="max-goals">Set Max Score</label>
<input type="number" id="max-goals" name="max-goals" min="1" max="21">
</div>
<script src="./js/score-keeper.js"></script>
</article>

</body>

</html>
